# Configuração de aplicação para o Backup Guardian
# Este arquivo é versionado no git e NÃO deve conter informações sensíveis.
# Todas as configurações específicas ficam em arquivo.env (não versionado).
#
# Para usar:
#   cp conf/env.example conf/arquivo.env
#   nano conf/arquivo.env

CONF_ENV_FILE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/arquivo.env"
if [[ -f "$CONF_ENV_FILE" ]]; then
  # shellcheck disable=SC1090
  source "$CONF_ENV_FILE"
else
  echo "Arquivo não encontrado: ${CONF_ENV_FILE}. Copie env.example para arquivo.env e preencha os valores." >&2
  return 1 2>/dev/null || exit 1
fi

# Validar variáveis obrigatórias do .env
: "${APP_NAME:?Defina APP_NAME em conf/arquivo.env}"
: "${APP_ID:?Defina APP_ID em conf/arquivo.env}"
: "${BACKUP_ROOT:?Defina BACKUP_ROOT em conf/arquivo.env}"
: "${GROUP:?Defina GROUP em conf/arquivo.env}"
: "${EMAIL_TO:?Defina EMAIL_TO em conf/arquivo.env}"
: "${ITEMS:?Defina array ITEMS em conf/arquivo.env}"

# Valores padrão (podem ser sobrescritos no .env)
DIR_PERMS="${DIR_PERMS:-2775}"
